services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: churn-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  

  ai:
    build: ./ai
    container_name: churn-ai
    ports:
      - "8001:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: churn-mongo
    ports:
      - "27017:27017"
    volumes:
      - churn-mongo-data:/data/db

  backend:
    build: ./backend
    container_name: churn-backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/churnDB
      - AI_SERVICE_URL=http://ai:8000
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey2024}
      - PASSWORD=${PASSWORD}
    depends_on:
      - mongo
      - ai
    restart: unless-stopped

volumes:
  churn-mongo-data:
    

  
