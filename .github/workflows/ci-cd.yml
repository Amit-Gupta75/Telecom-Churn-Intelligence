name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ── CI ─────────────────────────────────────────────────────────────────
  test-ai:
    name: Test AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Smoke-test imports
        run: |
          cd ai
          python -c "from model.preprocess import run; print('preprocess OK')"
          python -c "import shap; print('shap OK')"

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & syntax check
        run: |
          cd backend
          npm ci
          node --check server.js

  test-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: http://localhost:5000/api

  # ── CD: Build & Push to ECR ────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [test-ai, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push AI image
        run: |
          docker build -t $ECR_REGISTRY/churn-ai:${{ github.sha }} ./ai
          docker push $ECR_REGISTRY/churn-ai:${{ github.sha }}
          docker tag  $ECR_REGISTRY/churn-ai:${{ github.sha }} $ECR_REGISTRY/churn-ai:latest
          docker push $ECR_REGISTRY/churn-ai:latest

      - name: Build & push Backend image
        run: |
          docker build -t $ECR_REGISTRY/churn-backend:${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/churn-backend:${{ github.sha }}
          docker tag  $ECR_REGISTRY/churn-backend:${{ github.sha }} $ECR_REGISTRY/churn-backend:latest
          docker push $ECR_REGISTRY/churn-backend:latest

      - name: Build & push Frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.EC2_HOST }}/api \
            -t $ECR_REGISTRY/churn-frontend:${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/churn-frontend:${{ github.sha }}
          docker tag  $ECR_REGISTRY/churn-frontend:${{ github.sha }} $ECR_REGISTRY/churn-frontend:latest
          docker push $ECR_REGISTRY/churn-frontend:latest

  # ── CD: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Telecom-Churn-Intelligence

            git pull origin main

            cat > .env <<'EOF'
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            AI_SERVICE_URL=http://ai:8000
            PASSWORD=${{ secrets.DB_PASSWORD }}
            VITE_API_URL=http://${{ secrets.EC2_HOST }}/api
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            docker compose pull
            docker compose up -d --remove-orphans
