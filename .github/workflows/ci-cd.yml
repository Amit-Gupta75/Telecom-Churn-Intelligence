name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Test AI Service ─────────────────────────────────────
  test-ai:
    name: Test AI Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Smoke-test imports
        run: |
          cd ai
          python -c "from model.preprocess import run; print('preprocess OK')"
          python -c "import shap; print('shap OK')"


  # ── Test Backend ─────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install & syntax check
        run: |
          cd backend
          npm ci
          node --check server.js


  # ── Build Frontend ──────────────────────────────────────
  test-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install & build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
